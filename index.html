<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Avengers Character Search</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header><h1>Avengers Character Search</h1></header>
    <main>
        <label for="query">Search by Full Name or Alias</label>
        <div class="row">
            <input type="text" id="query" placeholder="e.g. Captain America or Steve Rogers">
            <button id="search">Search</button>
        </div>
        <h2>Result</h2>
        <div id="result"></div>
    </main>
</body>
</html>
